name: Feature request
description: An idea for something TernQuill could do, or do better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The situation or problem first; it helps more than a ready-made solution.
      placeholder: When I work with several servers, I'd like to …
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Your idea, if you have one. Sketches and screenshots of other apps are welcome.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Terminal / input bar
        - Tabs, split panes, broadcast
        - AI agents
        - Notes
        - Look and feel
        - Something else
